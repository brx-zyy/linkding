name: OIDC email verification security probe

on:
  push:
    branches:
      - audit/oidc-email-verified-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oidc-claim-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install project and test dependencies
        run: uv sync --locked --group dev
      - name: Prepare runtime data directory
        run: mkdir -p data
      - name: Start disposable Keycloak OpenID Provider
        run: |
          docker run -d --name linkding-oidc-provider \
            -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin-test-password \
            -e KC_HOSTNAME=http://127.0.0.1:8080 \
            -e KC_HOSTNAME_STRICT=false \
            -v "$GITHUB_WORKSPACE/bookmarks/tests/fixtures/oidc-unverified-email-realm.json:/opt/keycloak/data/import/linkding-probe-realm.json:ro" \
            quay.io/keycloak/keycloak:26.4.7 start-dev --import-realm
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/realms/linkding-probe/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs linkding-oidc-provider
          exit 1
      - name: Run real-provider OIDC account takeover test
        env:
          OIDC_TEST_PROVIDER_URL: http://127.0.0.1:8080
        run: uv run pytest bookmarks/tests/test_oidc_security_probe.py -q -rs
      - name: Show Keycloak logs on failure
        if: failure()
        run: docker logs linkding-oidc-provider
